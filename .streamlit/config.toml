[theme]
base = "dark"
primaryColor = "#00B4D8"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#161B22"
textColor = "#E6EDF3"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "minimal"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
enableStaticServing = true
fastReruns = true

[browser]
gatherUsageStats = false
